<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Diamond Blade Gradients -->
    <linearGradient id="diamondEdgeL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="diamondEdgeR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="diamondCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Hilt Gradients -->
    <linearGradient id="goldHilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Title Banner Gradients -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="diamondGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="10" />

  <!-- Magic Sparkles & Stars -->
  <g fill="#fef08a" opacity="0.9">
    <polygon points="120,80 126,96 142,102 126,108 120,124 114,108 98,102 114,96" />
    <polygon points="400,90 405,103 418,108 405,113 400,126 395,113 382,108 395,103" />
    <polygon points="90,320 94,332 106,336 94,340 90,352 86,340 74,336 86,332" />
    <polygon points="430,300 434,310 444,314 434,318 430,328 426,318 416,314 426,310" />
  </g>
  <circle cx="210" cy="70" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="340" cy="140" r="4" fill="#38bdf8" opacity="0.9" />
  <circle cx="100" cy="220" r="3" fill="#38bdf8" opacity="0.9" />

  <!-- Diamond Sword Aura / Glow -->
  <g transform="translate(256, 210) rotate(-45)" filter="url(#diamondGlow)">
    <ellipse cx="0" cy="-60" rx="45" ry="150" fill="#38bdf8" opacity="0.35" />
  </g>

  <!-- Gorgeous Diamond Sword (Angled diagonally, inspired by the wooden sword silhouette) -->
  <g transform="translate(256, 210) rotate(-45)">
    <!-- 1. Diamond Blade Tip & Edges -->
    <path d="M0 -220 L-26 -195 L-22 35 L0 40 Z" fill="url(#diamondEdgeL)" />
    <path d="M0 -220 L26 -195 L22 35 L0 40 Z" fill="url(#diamondEdgeR)" />
    <!-- Central Ridge & Crystal Facets -->
    <path d="M0 -220 L-12 -180 L0 -170 L12 -180 Z" fill="#ffffff" opacity="0.9" />
    <path d="M0 -170 L-10 -70 L0 -50 L10 -70 Z" fill="#e0f2fe" opacity="0.75" />
    <path d="M0 -50 L-8 20 L0 38 L8 20 Z" fill="#bae6fd" opacity="0.6" />
    <line x1="0" y1="-215" x2="0" y2="40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="-12" y1="-170" x2="-8" y2="-70" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- 2. Ornate Golden Crossguard (with central gem) -->
    <path
      d="M-58 35 C-55 18 -20 22 0 26 C20 22 55 18 58 35 C62 52 25 54 0 50 C-25 54 -62 52 -58 35 Z"
      fill="url(#goldHilt)"
      stroke="#78350f"
      stroke-width="3"
    />
    <circle cx="-56" cy="35" r="7" fill="url(#goldHilt)" stroke="#78350f" stroke-width="2" />
    <circle cx="56" cy="35" r="7" fill="url(#goldHilt)" stroke="#78350f" stroke-width="2" />
    <ellipse cx="0" cy="38" rx="10" ry="12" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <ellipse cx="-2" cy="35" rx="4" ry="5" fill="#fca5a5" />

    <!-- 3. Grip / Hilt with wrapped texture -->
    <rect x="-9" y="48" width="18" height="58" rx="4" fill="#0f172a" stroke="#78350f" stroke-width="2" />
    <line x1="-9" y1="60" x2="9" y2="60" stroke="#facc15" stroke-width="3" />
    <line x1="-9" y1="74" x2="9" y2="74" stroke="#facc15" stroke-width="3" />
    <line x1="-9" y1="88" x2="9" y2="88" stroke="#facc15" stroke-width="3" />

    <!-- 4. Ornate Gold Pommel with Crystal Core -->
    <circle cx="0" cy="115" r="16" fill="url(#goldHilt)" stroke="#78350f" stroke-width="3" />
    <circle cx="0" cy="115" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="-2" cy="113" r="3" fill="#ffffff" />
  </g>

  <!-- Big Diamond Sparkle on the blade tip -->
  <polygon points="125,75 131,60 137,75 152,81 137,87 131,102 125,87 110,81" fill="#ffffff" filter="url(#diamondGlow)" />

  <!-- App Title Banner & Text: 「ひらめきクエスト！」 -->
  <g transform="translate(256, 420)">
    <rect x="-210" y="-36" width="420" height="74" rx="37" fill="#020617" opacity="0.8" />
    <rect
      x="-204"
      y="-32"
      width="408"
      height="66"
      rx="33"
      fill="#1e1b4b"
      stroke="#38bdf8"
      stroke-width="4"
    />
    <rect x="-192" y="-22" width="384" height="46" rx="23" fill="#0f172a" />

    <text
      x="0"
      y="14"
      text-anchor="middle"
      font-family="'M PLUS Rounded 1c', 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif"
      font-weight="900"
      font-size="38"
      fill="#78350f"
      stroke="#451a03"
      stroke-width="8"
      stroke-linejoin="round"
      letter-spacing="1.5"
    >
      ひらめきクエスト！
    </text>
    <text
      x="0"
      y="11"
      text-anchor="middle"
      font-family="'M PLUS Rounded 1c', 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif"
      font-weight="900"
      font-size="38"
      fill="url(#textGold)"
      stroke="#713f12"
      stroke-width="2"
      letter-spacing="1.5"
    >
      ひらめきクエスト！
    </text>
    <circle cx="-160" cy="-6" r="3" fill="#ffffff" />
    <polygon points="175,-12 178,-6 184,-3 178,0 175,6 172,0 166,-3 172,-6" fill="#fef08a" />
  </g>
</svg>
